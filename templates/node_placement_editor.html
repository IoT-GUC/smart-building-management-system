<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Node Placement Editor</title>
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#08111f">
    <meta name="apple-mobile-web-app-capable" content="yes">

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#0f172a;
    color:#e5e7eb;
}

.header{
    padding:24px 34px;
    background:#111827;
    border-bottom:1px solid #334155;
}

.header h1{
    margin:0;
    font-size:28px;
    color:#f8fafc;
}

.header p{
    margin:8px 0 0;
    color:#cbd5e1;
}

.toolbar{
    padding:16px 34px;
    background:#0f172a;
    border-bottom:1px solid #1e293b;
    display:flex;
    gap:12px;
    align-items:center;
    flex-wrap:wrap;
}

.toolbar label{
    color:#cbd5e1;
    font-weight:bold;
}

.toolbar input,
.toolbar select,
.toolbar option,
.toolbar button{
    width:auto;
    padding:10px 13px;
    border-radius:8px;
    border:1px solid #334155;
    font-size:14px;
}

.toolbar input,
.toolbar select,
option {
    background:#1e293b !important;
    color:#ffffff !important;
}

.toolbar button{
    border:none;
    cursor:pointer;
    font-weight:bold;
    color:white;
    background:#2563eb;
}

.toolbar button:hover{
    background:#1d4ed8;
}

.adminHomeBtn{
    background:#334155 !important;
}

.adminHomeBtn:hover{
    background:#475569 !important;
}

.layout{
    display:flex;
    height:calc(100vh - 152px);
}

.mapArea{
    flex:1;
    position:relative;
    overflow:auto;
    padding:24px 34px;
}

.canvasBox{
    position:relative;
    width:calc(100vw - 430px);
    background:#111827;
    border:1px solid #334155;
    border-radius:16px;
    padding:14px;
    box-shadow:0 16px 40px rgba(0,0,0,0.35);
}

#floorImage{
    width:100%;
    height:auto;
    display:block;
    border:1px solid #334155;
    border-radius:12px;
    background:#020617;
    opacity:0.92;
}

#overlay{
    position:absolute;
    top:14px;
    left:14px;
    width:calc(100% - 28px);
    height:calc(100% - 28px);
}

#nodesLayer{
    position:absolute;
    top:14px;
    left:14px;
    width:calc(100% - 28px);
    height:calc(100% - 28px);
}

.roomPolygon{
    fill:rgba(37,99,235,0.18);
    stroke:#60a5fa;
    stroke-width:3;
}

.roomLabel{
    fill:#93c5fd;
    font-size:15px;
    font-weight:bold;
    paint-order:stroke;
    stroke:#020617;
    stroke-width:3px;
}

.node{
    position:absolute;
    transform:translate(-50%, -50%);
    padding:8px 12px;
    border-radius:999px;
    background:#16a34a;
    color:white;
    font-weight:bold;
    font-size:12px;
    cursor:grab;
    z-index:20;
    white-space:nowrap;
    box-shadow:0 8px 20px rgba(0,0,0,.45);
    border:1px solid rgba(255,255,255,0.25);
}

.node.selected{
    outline:4px solid #f59e0b;
}

.sidePanel{
    width:330px;
    background:#111827;
    border-left:1px solid #334155;
    padding:18px;
    overflow:auto;
    box-shadow:-8px 0 24px rgba(0,0,0,0.25);
}

.sidePanel h2{
    margin-top:0;
    color:#f8fafc;
}

.sidePanel h3{
    color:#93c5fd;
}

.deviceItem{
    padding:10px;
    border-radius:8px;
    background:#020617;
    border:1px solid #334155;
    margin-bottom:8px;
    cursor:pointer;
    color:#e5e7eb;
}

.deviceItem:hover{
    background:#1e293b;
}

.deviceItem.active{
    background:#78350f;
    border-color:#f59e0b;
    font-weight:bold;
}

.sidePanel label{
    color:#cbd5e1;
    font-size:14px;
    font-weight:bold;
}

.sidePanel input,
.sidePanel select,
.sidePanel button{
    width:100%;
    box-sizing:border-box;
    padding:10px;
    margin-top:8px;
    margin-bottom:10px;
    border-radius:8px;
}

.sidePanel input,
.sidePanel select{
    border:1px solid #334155;
    background:#020617;
    color:white;
}

.sidePanel button{
    border:none;
    background:#2563eb;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

.sidePanel button:hover{
    background:#1d4ed8;
}

.saveBtn{
    background:#16a34a !important;
}

.saveBtn:hover{
    background:#15803d !important;
}

.resetBtn{
    background:#64748b !important;
}

.resetBtn:hover{
    background:#475569 !important;
}

.hint{
    font-size:12px;
    color:#94a3b8;
    line-height:1.5;
}

hr{
    border:none;
    border-top:1px solid #334155;
.addDeviceBtn{
    background:#16a34a !important;
    color:white !important;
}

.addDeviceBtn:hover{
    background:#15803d !important;
}

.modalOverlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(15, 23, 42, 0.85);
    backdrop-filter: blur(4px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10000;
}

.modalCard {
    background: #111827;
    border: 1px solid #334155;
    border-radius: 18px;
    padding: 24px;
    width: 450px;
    max-width: calc(100vw - 32px);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    color: white;
}

.modalCard h3 {
    margin-top: 0;
    color: #f8fafc;
    font-size: 20px;
}

.modalCard label {
    display: block;
    margin-top: 12px;
    margin-bottom: 4px;
    color: #cbd5e1;
    font-weight: bold;
    font-size: 13px;
}

.modalCard input, .modalCard select {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid #334155;
    background: #020617;
    color: white;
    box-sizing: border-box;
}

.modalActions {
    display: flex;
    gap: 10px;
    margin-top: 20px;
}

.modalActions button {
    flex: 1;
    padding: 11px;
    border-radius: 8px;
    border: none;
    font-weight: bold;
    cursor: pointer;
}
</style>
<link rel="stylesheet" href="/static/bright_theme.css">
</head>

<body>

<div class="header">
    <h1>Node Placement Editor</h1>
    <p>View floor plans or site photos, add devices directly to maps, drag nodes to position, and save location coordinates.</p>
</div>

<div class="toolbar">
    <button class="adminHomeBtn" onclick="window.location.href='/admin'">
        ← Admin Home
    </button>

    <label>View Mode:</label>
    <select id="viewModeSelect" onchange="toggleViewMode()">
        <option value="floor">Floor Plan View</option>
        <option value="site">Site / Campus Photo View</option>
    </select>

    <span id="floorControlGroup">
        <label>Floor:</label>
        <select id="floorId" onchange="loadFloor()"></select>
    </span>

    <span id="siteControlGroup" style="display:none;">
        <label>Site / Campus:</label>
        <select id="siteId" onchange="loadSiteMap()"></select>
    </span>

    <button class="addDeviceBtn" onclick="openAddDeviceModal()">
        + Add New Device
    </button>
</div>

<div class="layout">

    <div class="mapArea">
        <div class="canvasBox" id="canvasBox">
            <img id="floorImage">
            <svg id="overlay"></svg>
            <div id="nodesLayer"></div>
        </div>
    </div>

    <div class="sidePanel">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h2 style="margin:0;">Node Placement</h2>
            <button class="addDeviceBtn" style="padding:6px 10px; font-size:12px;" onclick="openAddDeviceModal()">+ Add Device</button>
        </div>

        <h3>Devices</h3>
        <div id="deviceList"></div>

        <hr>

        <label>Selected Device</label>
        <input id="selectedDeviceName" readonly>

        <span id="roomAssignmentSection">
            <label>Assign To Room</label>
            <select id="roomSelect"></select>
            <button onclick="assignToRoom()">Assign To Room Center</button>
        </span>

        <button class="saveBtn" onclick="savePosition()">Save Current Position</button>
        <button class="resetBtn" id="resetPositionBtn" onclick="resetToRoomCenter()">Reset To Center</button>

        <p class="hint" id="modeHint">
            Drag node on the map, then press Save Current Position.
        </p>
    </div>

</div>

<!-- Modal Dialog: Add Device Directly -->
<div id="addDeviceModal" class="modalOverlay" style="display:none;">
    <div class="modalCard">
        <h3>+ Add New Device to Map</h3>
        
        <label>Device ID *</label>
        <input id="modalDeviceId" placeholder="Example: ENV-NODE-105">

        <label>Label / Friendly Name</label>
        <input id="modalDeviceLabel" placeholder="Example: Main Lobby Temp Sensor">

        <label>Node Type</label>
        <select id="modalNodeType">
            <option value="gateway">Gateway (LoRaWAN / Edge Base Station)</option>
            <option value="environment">Environment (Temp/Humid/CO2/IAQ)</option>
            <option value="energy">Energy (Power/Current/Voltage)</option>
            <option value="safety">Safety (Smoke/Gas/Water Leak)</option>
            <option value="occupancy">Occupancy (Motion/Presence/PIR)</option>
            <option value="actuator">Actuator (Relay/HVAC Control)</option>
            <option value="hybrid">Hybrid Node</option>
            <option value="multi">Multi-Sensor Node</option>
        </select>

        <label>Target Site</label>
        <select id="modalSiteSelect"></select>

        <label>Target Building (Optional)</label>
        <select id="modalBuildingSelect"></select>

        <div class="modalActions">
            <button class="addDeviceBtn" onclick="submitModalAddDevice()">Create & Add Device</button>
            <button class="resetBtn" onclick="closeAddDeviceModal()">Cancel</button>
        </div>

        <div id="modalStatus" style="margin-top:12px; font-size:13px;"></div>
    </div>
</div>

<script>
let currentViewMode = "floor"; // "floor" or "site"
let floorData = null;
let siteData = null;
let siteDevices = [];
let allBuildings = [];
let selectedDevice = null;
let selectedNodeEl = null;
let dragging = false;
let dragDevice = null;

const image = document.getElementById("floorImage");
const overlay = document.getElementById("overlay");
const nodesLayer = document.getElementById("nodesLayer");

function iconFor(type){
    if(type === "environment") return "🌡";
    if(type === "occupancy") return "👤";
    if(type === "safety") return "🔥";
    if(type === "energy") return "⚡";
    return "📡";
}

function originalToDisplay(p){
    const s = siteData?.site || siteData;
    const origWidth = (currentViewMode === "site" && siteData) ? (s?.image_width || siteData?.image_width || 1200) : (floorData?.floor?.image_width || 1000);
    const origHeight = (currentViewMode === "site" && siteData) ? (s?.image_height || siteData?.image_height || 800) : (floorData?.floor?.image_height || 800);
    return {
        x: p.x * image.clientWidth / origWidth,
        y: p.y * image.clientHeight / origHeight
    };
}

function displayToOriginal(x, y){
    const s = siteData?.site || siteData;
    const origWidth = (currentViewMode === "site" && siteData) ? (s?.image_width || siteData?.image_width || 1200) : (floorData?.floor?.image_width || 1000);
    const origHeight = (currentViewMode === "site" && siteData) ? (s?.image_height || siteData?.image_height || 800) : (floorData?.floor?.image_height || 800);
    return {
        x: Math.round(x * origWidth / image.clientWidth),
        y: Math.round(y * origHeight / image.clientHeight)
    };
}

function toggleViewMode() {
    currentViewMode = document.getElementById("viewModeSelect").value;
    const floorGroup = document.getElementById("floorControlGroup");
    const siteGroup = document.getElementById("siteControlGroup");
    const roomSection = document.getElementById("roomAssignmentSection");
    const resetBtn = document.getElementById("resetPositionBtn");
    const modeHint = document.getElementById("modeHint");

    if (currentViewMode === "site") {
        floorGroup.style.display = "none";
        siteGroup.style.display = "inline";
        roomSection.style.display = "none";
        if (resetBtn) resetBtn.style.display = "none";
        modeHint.innerText = "Drag device on the site map photo, then press Save Current Position.";
        loadSiteDropdown();
    } else {
        floorGroup.style.display = "inline";
        siteGroup.style.display = "none";
        roomSection.style.display = "block";
        if (resetBtn) resetBtn.style.display = "block";
        modeHint.innerText = "Drag node on the floor map, then press Save Current Position.";
        loadFloor();
    }
}

async function loadSiteDropdown() {
    const select = document.getElementById("siteId");
    try {
        const res = await fetch("/sites");
        const sites = await res.json();

        select.innerHTML = `<option value="">Select site</option>`;
        sites.forEach(s => {
            select.innerHTML += `<option value="${s.id}">${s.name || "Site " + s.id}</option>`;
        });

        const params = new URLSearchParams(window.location.search);
        const reqSiteId = params.get("site_id");

        if (reqSiteId && sites.some(s => String(s.id) === String(reqSiteId))) {
            select.value = reqSiteId;
        } else if (sites.length > 0) {
            select.value = sites[0].id;
        }

        if (select.value) {
            await loadSiteMap();
        }
    } catch (e) {
        console.error("Could not load sites", e);
    }
}

async function loadSiteMap() {
    const siteId = document.getElementById("siteId").value;
    if (!siteId) return;

    selectedDevice = null;
    selectedNodeEl = null;
    dragDevice = null;

    document.getElementById("selectedDeviceName").value = "";
    document.getElementById("deviceList").innerHTML = "";
    nodesLayer.innerHTML = "";
    overlay.innerHTML = "";

    try {
        const mapRes = await fetch(`/sites/${siteId}/map`);
        siteData = await mapRes.json();

        const devRes = await fetch(`/sites/${siteId}/devices`);
        siteDevices = await devRes.json();

        const imagePath = siteData.campus_image_path || siteData.image_path || siteData.site?.campus_image_path || siteData.site?.image_path;
        if (!imagePath) {
            alert("No site map photo has been uploaded for this site yet.");
            return;
        }

        image.src = imagePath;

        image.onload = function() {
            overlay.setAttribute("width", image.clientWidth);
            overlay.setAttribute("height", image.clientHeight);
            drawSiteBuildings();
            drawSiteNodes();
            renderSiteDeviceList();
        };

        if (image.complete) {
            drawSiteBuildings();
            drawSiteNodes();
            renderSiteDeviceList();
        }
    } catch (err) {
        alert("Error loading site map: " + err.message);
    }
}

function drawSiteBuildings() {
    overlay.innerHTML = "";
    if (!siteData || !siteData.buildings) return;

    siteData.buildings.forEach(b => {
        if (!b.polygon_points || b.polygon_points.length < 3) return;

        const pts = b.polygon_points.map(originalToDisplay);
        const poly = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
        poly.setAttribute("points", pts.map(p => `${p.x},${p.y}`).join(" "));
        poly.setAttribute("class", "roomPolygon");
        overlay.appendChild(poly);

        if (b.center_x && b.center_y) {
            const center = originalToDisplay({x: b.center_x, y: b.center_y});
            const label = document.createElementNS("http://www.w3.org/2000/svg", "text");
            label.setAttribute("x", center.x);
            label.setAttribute("y", center.y);
            label.setAttribute("class", "roomLabel");
            label.textContent = b.name;
            overlay.appendChild(label);
        }
    });
}

function drawSiteNodes() {
    nodesLayer.innerHTML = "";
    siteDevices.forEach(device => {
        const node = document.createElement("div");

        const px = device.x || 100;
        const py = device.y || 100;
        const pos = originalToDisplay({x: px, y: py});

        node.className = "node";
        node.style.left = pos.x + "px";
        node.style.top = pos.y + "px";
        node.innerText = iconFor(device.node_type) + " " + (device.label || device.device_id);

        node.onmousedown = function(e) {
            e.preventDefault();
            selectDevice(device, node);
            dragging = true;
            dragDevice = device;
            node.style.cursor = "grabbing";
        };

        node.onclick = function(e) {
            e.stopPropagation();
            selectDevice(device, node);
        };

        nodesLayer.appendChild(node);
    });
}

function renderSiteDeviceList() {
    const list = document.getElementById("deviceList");
    list.innerHTML = "";

    siteDevices.forEach(device => {
        const div = document.createElement("div");
        div.className = "deviceItem" + (selectedDevice && selectedDevice.device_id === device.device_id ? " active" : "");
        div.innerText = iconFor(device.node_type) + " " + (device.label || device.device_id);

        div.onclick = function() {
            selectedDevice = device;
            document.getElementById("selectedDeviceName").value = device.label || device.device_id;
            renderSiteDeviceList();
        };

        list.appendChild(div);
    });
}

async function openAddDeviceModal() {
    const modal = document.getElementById("addDeviceModal");
    const status = document.getElementById("modalStatus");
    const siteSelect = document.getElementById("modalSiteSelect");
    const bldSelect = document.getElementById("modalBuildingSelect");
    
    status.innerText = "";
    modal.style.display = "flex";

    try {
        const sitesRes = await fetch("/sites");
        if (sitesRes.ok) {
            const siteList = await sitesRes.json();
            siteSelect.innerHTML = `<option value="">Select site</option>`;
            siteList.forEach(s => {
                siteSelect.innerHTML += `<option value="${s.id}">${s.name || "Site " + s.id}</option>`;
            });

            const activeSiteId = document.getElementById("siteId")?.value;
            if (activeSiteId) siteSelect.value = activeSiteId;
        }

        const res = await fetch("/buildings");
        if (res.ok) {
            allBuildings = await res.json();
            bldSelect.innerHTML = `<option value="">Select building (Optional)</option>`;
            allBuildings.forEach(b => {
                bldSelect.innerHTML += `<option value="${b.id}">${b.name}</option>`;
            });

            if (floorData?.floor?.building_id) {
                bldSelect.value = floorData.floor.building_id;
            }
        }
    } catch (e) {
        console.error("Could not load sites/buildings for modal", e);
    }
}

function closeAddDeviceModal() {
    document.getElementById("addDeviceModal").style.display = "none";
}

async function submitModalAddDevice() {
    const device_id = document.getElementById("modalDeviceId").value.trim();
    const label = document.getElementById("modalDeviceLabel").value.trim();
    const node_type = document.getElementById("modalNodeType").value;
    const siteVal = document.getElementById("modalSiteSelect").value;
    const bldVal = document.getElementById("modalBuildingSelect").value;
    const status = document.getElementById("modalStatus");

    if (!device_id) {
        status.style.color = "#fecaca";
        status.innerText = "Device ID is required.";
        return;
    }

    const payload = {
        device_id: device_id,
        label: label || device_id,
        node_type: node_type
    };

    if (bldVal) {
        payload.building_id = Number(bldVal);
    }
    if (siteVal) {
        payload.site_id = Number(siteVal);
    }

    if (currentViewMode === "site") {
        const mainSiteId = document.getElementById("siteId")?.value;
        if (!payload.site_id && mainSiteId) payload.site_id = Number(mainSiteId);
    } else {
        const mainFloorId = document.getElementById("floorId")?.value;
        if (!payload.building_id && mainFloorId) payload.floor_id = Number(mainFloorId);
    }

    if (!payload.building_id && !payload.floor_id && !payload.site_id) {
        status.style.color = "#fecaca";
        status.innerText = "Please select a Target Site or Target Building.";
        return;
    }

    try {
        status.style.color = "#93c5fd";
        status.innerText = "Creating device...";

        const res = await fetch("/devices", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify(payload)
        });

        const data = await res.json();
        if (!res.ok) {
            throw new Error(data.detail || "Failed to create device");
        }

        status.style.color = "#86efac";
        status.innerText = `Device '${device_id}' added successfully!`;

        setTimeout(async () => {
            closeAddDeviceModal();
            document.getElementById("modalDeviceId").value = "";
            document.getElementById("modalDeviceLabel").value = "";

            if (currentViewMode === "site") {
                await loadSiteMap();
            } else {
                await loadFloor();
            }
        }, 500);

    } catch (err) {
        status.style.color = "#fecaca";
        status.innerText = err.message;
    }
}

async function loadFloor(){
    const floorId = document.getElementById("floorId").value;

    if (!floorId) {
        return;
    }

    selectedDevice = null;
    selectedNodeEl = null;
    dragDevice = null;

    document.getElementById("selectedDeviceName").value = "";
    document.getElementById("deviceList").innerHTML = "";
    document.getElementById("roomSelect").innerHTML = "";
    nodesLayer.innerHTML = "";
    overlay.innerHTML = "";

    const res = await fetch(`/floors/${floorId}/live`);
    floorData = await res.json();

    if (!floorData.floor || !floorData.floor.image_path) {
        alert("No floor plan image has been uploaded for this floor yet.");
        return;
    }

    image.src = floorData.floor.image_path;

    image.onload = function(){
        overlay.setAttribute("width", image.clientWidth);
        overlay.setAttribute("height", image.clientHeight);

        drawRooms();
        drawNodes();
        renderDeviceList();
        renderRoomSelect();
    };

    if(image.complete){
        drawRooms();
        drawNodes();
        renderDeviceList();
        renderRoomSelect();
    }
}

function allDevices(){
    let devices = [];
    if (!floorData || !floorData.rooms) return devices;

    floorData.rooms.forEach(room => {
        room.devices.forEach(device => {
            device._room = room;
            devices.push(device);
        });
    });

    return devices;
}

function drawRooms(){
    overlay.innerHTML = "";
    if (!floorData || !floorData.rooms) return;

    floorData.rooms.forEach(room => {
        if(!room.polygon_points || room.polygon_points.length < 3) return;

        const pts = room.polygon_points.map(originalToDisplay);

        const poly = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
        poly.setAttribute("points", pts.map(p => `${p.x},${p.y}`).join(" "));
        poly.setAttribute("class", "roomPolygon");
        overlay.appendChild(poly);

        const center = originalToDisplay({x: room.x, y: room.y});

        const label = document.createElementNS("http://www.w3.org/2000/svg", "text");
        label.setAttribute("x", center.x);
        label.setAttribute("y", center.y);
        label.setAttribute("class", "roomLabel");
        label.textContent = room.room_name;
        overlay.appendChild(label);
    });
}

function drawNodes(){
    nodesLayer.innerHTML = "";

    allDevices().forEach(device => {
        const node = document.createElement("div");

        const room = device._room;

        const px = device.x || room.x;
        const py = device.y || room.y;

        const pos = originalToDisplay({x:px, y:py});

        node.className = "node";
        node.style.left = pos.x + "px";
        node.style.top = pos.y + "px";

        node.innerText =
            iconFor(device.node_type) + " " + (device.label || device.device_id);

        node.onmousedown = function(e){
            e.preventDefault();
            selectDevice(device, node);
            dragging = true;
            dragDevice = device;
            node.style.cursor = "grabbing";
        };

        node.onclick = function(e){
            e.stopPropagation();
            selectDevice(device, node);
        };

        nodesLayer.appendChild(node);
    });
}

document.addEventListener("mousemove", function(e){
    if(!dragging || !dragDevice || !selectedNodeEl) return;

    const rect = nodesLayer.getBoundingClientRect();

    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;

    selectedNodeEl.style.left = x + "px";
    selectedNodeEl.style.top = y + "px";

    const original = displayToOriginal(x, y);

    dragDevice.x = original.x;
    dragDevice.y = original.y;
});

document.addEventListener("mouseup", function(){
    if(selectedNodeEl){
        selectedNodeEl.style.cursor = "grab";
    }

    dragging = false;
    dragDevice = null;
});

function selectDevice(device, nodeEl){
    selectedDevice = device;

    if(selectedNodeEl){
        selectedNodeEl.classList.remove("selected");
    }

    selectedNodeEl = nodeEl;

    if(selectedNodeEl){
        selectedNodeEl.classList.add("selected");
    }

    document.getElementById("selectedDeviceName").value =
        device.label || device.device_id;

    if (currentViewMode === "floor") {
        document.getElementById("roomSelect").value =
            device.room_id || "";
        renderDeviceList();
    } else {
        renderSiteDeviceList();
    }
}

function renderDeviceList(){
    const list = document.getElementById("deviceList");
    list.innerHTML = "";

    allDevices().forEach(device => {
        const div = document.createElement("div");

        div.className =
            "deviceItem" +
            (selectedDevice && selectedDevice.device_id === device.device_id ? " active" : "");

        div.innerText =
            iconFor(device.node_type) + " " + (device.label || device.device_id);

        div.onclick = function(){
            selectedDevice = device;
            document.getElementById("selectedDeviceName").value =
                device.label || device.device_id;
            document.getElementById("roomSelect").value =
                device.room_id || "";
            renderDeviceList();
        };

        list.appendChild(div);
    });
}

function renderRoomSelect(){
    const select = document.getElementById("roomSelect");
    select.innerHTML = "";
    if (!floorData || !floorData.rooms) return;

    floorData.rooms.forEach(room => {
        const opt = document.createElement("option");
        opt.value = room.id;
        opt.textContent = room.room_name;
        select.appendChild(opt);
    });
}

async function savePosition(){
    if(!selectedDevice){
        alert("Select a device first");
        return;
    }

    const roomId = currentViewMode === "floor" ? document.getElementById("roomSelect").value : null;

    const res = await fetch(`/devices/${selectedDevice.device_id}/position`, {
        method:"PUT",
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify({
            x:selectedDevice.x,
            y:selectedDevice.y,
            room_id: roomId ? Number(roomId) : null
        })
    });

    const data = await res.json();

    if(!res.ok){
        alert(JSON.stringify(data));
        return;
    }

    alert("Device position saved");

    if (currentViewMode === "site") {
        await loadSiteMap();
    } else {
        await loadFloor();
    }
}

function getRoomById(roomId){
    return floorData.rooms.find(r => Number(r.id) === Number(roomId));
}

async function assignToRoom(){
    if(!selectedDevice){
        alert("Select a device first");
        return;
    }

    const roomId = document.getElementById("roomSelect").value;
    const room = getRoomById(roomId);

    if(!room){
        alert("Select room");
        return;
    }

    selectedDevice.x = room.x;
    selectedDevice.y = room.y;
    selectedDevice.room_id = room.id;

    await savePosition();
}

async function resetToRoomCenter(){
    await assignToRoom();
}

window.onload = loadFloor;
async function loadFloorDropdown() {
    const select = document.getElementById("floorId");

    try {
        const res = await fetch("/floors");
        const floors = await res.json();

        select.innerHTML = `<option value="">Select floor</option>`;

        floors.forEach(floor => {
            const label = `${floor.name || "Floor"} / Building ID ${floor.building_id} / ID ${floor.id}`;

            select.innerHTML += `
                <option value="${floor.id}">
                    ${label}
                </option>
            `;
        });

        const params = new URLSearchParams(window.location.search);
        const requestedFloorId = params.get("floor_id");

        if (
            requestedFloorId &&
            floors.some(floor => String(floor.id) === String(requestedFloorId))
        ) {
            select.value = requestedFloorId;
            loadFloor();
        }

        else if (floors.length > 0) {
            select.value = floors[0].id;
            loadFloor();
        }

    } catch (err) {
        console.error("Could not load floors:", err);
    }
}

document.addEventListener("DOMContentLoaded", loadFloorDropdown);
